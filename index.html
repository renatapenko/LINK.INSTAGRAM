<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Renata Penko Maximiliano</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{
  background:#F5EFE8;
  color:#1A1A18;
  font-family:'Jost',sans-serif;
  font-weight:300;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:72px 24px;
  min-height:100vh;
}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}

.monograma{
  width:96px;height:96px;border-radius:50%;
  border:1px solid #C4A882;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:24px;
  font-family:'Cormorant Garamond',serif;
  font-size:36px;font-weight:300;font-style:italic;
  color:#B5623A;
  background:#FDF9F4;
}

.nome{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(22px,5vw,30px);
  font-weight:300;
  color:#1A1A18;
  line-height:1.2;
  margin-bottom:10px;
  letter-spacing:.5px;
}
.nome em{font-style:italic;color:#B5623A}

.cargo{
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#99998A;
  margin-bottom:6px;
  line-height:1.8;
}

.esp{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  font-style:italic;
  color:#7A7468;
  margin-bottom:48px;
  line-height:1.6;
}

.linha{width:32px;height:1px;background:#C4A882;margin:0 auto 40px}

.links{display:flex;flex-direction:column;gap:10px;width:100%}

.link{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 24px;
  text-decoration:none;
  font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;
  transition:all .3s;
  border-radius:2px;
}

.link-principal{
  background:#3D2B1F;
  color:#FAF6F0;
  border:1px solid #3D2B1F;
}
.link-principal:hover{background:#2A1D15;border-color:#2A1D15}

.link-wpp{
  background:transparent;
  color:#3D2B1F;
  border:1px solid #C4A882;
}
.link-wpp:hover{background:#3D2B1F;color:#FAF6F0;border-color:#3D2B1F}

.link-ig{
  background:transparent;
  color:#99998A;
  border:1px solid #E2E0D8;
}
.link-ig:hover{background:#F5EFE8;color:#3D2B1F;border-color:#C4A882}

.rodape{
  margin-top:52px;
  font-size:10px;
  color:#C4A882;
  letter-spacing:3px;
  text-transform:uppercase;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="monograma">R</div>

  <h1 class="nome">Renata Penko<br><em>Maximiliano</em></h1>
  <p class="cargo">Psicanalista &middot; Psicoterapeuta</p>
  <p class="esp">Especialista em relacionamentos<br>e identidade relacional</p>

  <div class="linha"></div>

  <div class="links">

    <a class="link link-principal" href="https://sessao-pocket.netlify.app" target="_blank">
      Sess&atilde;o Pocket &mdash; Conhe&ccedil;a
    </a>

    <a class="link link-wpp" href="https://wa.me/5567981448229?text=Ol%C3%A1%2C%20quero%20saber%20mais%20sobre%20a%20Sess%C3%A3o%20Pocket" target="_blank">
      Falar no WhatsApp
    </a>

    <a class="link link-ig" href="https://www.instagram.com/renatamaximiliano.psicoterapia?igsh=MXFzNGpmaGlkMXZ3Ng==" target="_blank">
      Instagram
    </a>

  </div>

  <p class="rodape">@renatamaximiliano.psicoterapia</p>

</div>
</body>
</html>
