<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renata Penko Maximiliano</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1a5c52;
  --teal-mid:#22756a;
  --teal-light:#d4eae7;
  --teal-pale:#eef6f5;
  --teal-dark:#0f3830;
  --white:#fff;
  --text:#0f2e2a;
  --muted:#4a7870;
  --subtle:#8ab5af;
  --border:rgba(26,92,82,0.13);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--teal-dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:absolute;top:-120px;right:-120px;width:380px;height:380px;border-radius:50%;background:rgba(26,92,82,.25);pointer-events:none}
body::after{content:'';position:absolute;bottom:-80px;left:-80px;width:260px;height:260px;border-radius:50%;background:rgba(26,92,82,.18);pointer-events:none}

.wrap{width:100%;max-width:400px;position:relative;z-index:1;animation:fadeUp .8s ease both;text-align:center}

/* AVATAR */
.avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:rgba(255,255,255,.7);font-style:italic}

/* NAME */
.name{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,7vw,36px);font-weight:300;line-height:1.15;color:#fff;margin-bottom:.5rem}
.name em{font-style:italic;color:rgba(255,255,255,.55)}
.role{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:.4rem;font-weight:400}
.spec{font-size:14px;color:rgba(255,255,255,.45);line-height:1.6;margin-bottom:2rem;font-family:'Cormorant Garamond',serif;font-style:italic}

/* BUTTONS */
.btns{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}

.btn{display:block;text-decoration:none;border-radius:14px;padding:14px 20px;font-size:14.5px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .2s;letter-spacing:.01em;text-align:center}

.btn-primary{background:var(--teal-mid);color:#fff;border:1px solid rgba(255,255,255,.12)}
.btn-primary:hover{background:var(--teal);transform:translateY(-1px)}

.btn-destaque{background:rgba(255,255,255,.95);color:var(--teal-dark);border:none}
.btn-destaque:hover{background:#fff;transform:translateY(-1px)}
.btn-destaque .btn-eye{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal-mid);display:block;margin-bottom:2px;font-weight:500}
.btn-destaque .btn-label{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;color:var(--teal-dark)}

.btn-ghost{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}

/* HANDLE */
.handle{font-size:12px;color:rgba(255,255,255,.2);margin-top:.5rem;letter-spacing:.05em}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:400px){body{padding:1.5rem 1rem}}
</style>
</head>
<body>
<div class="wrap">

  <div class="avatar">R</div>

  <div class="name">Renata Penko <em>Maximiliano</em></div>
  <div class="role">Psicanalista · Psicoterapeuta</div>
  <div class="spec">Especialista em relacionamentos<br>e identidade relacional</div>

  <div class="btns">

    <a href="https://renatapenko.github.io/teste.7couracas/" class="btn btn-destaque">
      <span class="btn-eye">Teste gratuito</span>
      <span class="btn-label">Você ainda consegue deixar alguém entrar na sua vida?</span>
    </a>

    <a href="https://sessao-pocket.netlify.app" class="btn btn-primary">Sessão Pocket — Conheça</a>

    <a href="https://www.instagram.com/renatamaximiliano.psicanalista?igsh=MXFzNGpmaGlkMXZ3Ng==" class="btn btn-ghost" target="_blank">Instagram</a>

    <a href="https://wa.me/5567981448229?text=Olá%2C%20quero%20saber%20mais%20sobre%20a%20Sessão%20Pocket" class="btn btn-ghost" target="_blank">Falar no WhatsApp</a>

  </div>

  <div class="handle">@renatamaximiliano.psicanalista</div>

</div>
</body>
</html>
